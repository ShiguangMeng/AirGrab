name: Android Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 AirGrab (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 生成 Gradle Wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.11.1

      - name: 下载 MediaPipe 手部关键点模型
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets
          curl -fsSL -o android/app/src/main/assets/hand_landmarker.task \
            https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task
          ls -la android/app/src/main/assets

      - name: 编译 Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace > build.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "=== 构建失败，错误摘要 ==="
            grep -E "^e: |error:|FAILURE|What went wrong|Could not resolve|Could not find" build.log | head -40 || true
          fi
          exit $code

      - name: 回写编译日志（仅在失败时）
        if: failure()
        run: |
          mkdir -p ci-logs
          sed -n '/FAILURE:/,$p' android/build.log | head -80 > ci-logs/android-errors.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-logs
          git commit -m "ci: 记录 Android 编译错误 [skip ci]" || exit 0
          git push || exit 0

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: AirGrab-Android-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: 汇总
        run: |
          {
            echo "## AirGrab Android 构建结果"
            echo ""
            echo "- Runner：${{ runner.os }}"
            echo "- 产物：Debug APK（含 MediaPipe 手部关键点模型）"
          } >> "$GITHUB_STEP_SUMMARY"
