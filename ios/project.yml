name: AirGrab
options:
  bundleIdPrefix: com.shiguangmeng
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""

targets:
  AirGrab:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: AirGrab
    settings:
      base:
        PRODUCT_NAME: AirGrab
        PRODUCT_BUNDLE_IDENTIFIER: com.shiguangmeng.airgrab
        INFOPLIST_FILE: AirGrab/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
        # Assets.xcassets/AppIcon.appiconset 里的资产名
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  AirGrab:
    build:
      targets:
        AirGrab: all
    run:
      config: Debug
    archive:
      config: Release
